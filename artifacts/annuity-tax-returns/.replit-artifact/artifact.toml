kind = "web"
previewPath = "/"
title = "Annuity Tax Returns"
version = "1.0.0"
id = "artifacts/annuity-tax-returns"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22242

[services.development]
run = "pnpm --filter @workspace/annuity-tax-returns run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/annuity-tax-returns", "run", "build" ]
publicDir = "artifacts/annuity-tax-returns/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22242"
BASE_PATH = "/"
